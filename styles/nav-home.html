<script>
document.addEventListener("DOMContentLoaded", function () {
  var THEME_KEY = "letrinhan-site-theme";
  var LANG_KEY = "letrinhan-site-locale";

  /* Keep in sync with hub LOCAL_SITE_BASE + local preview ports */
  var PROD_ORIGIN = "https://letrinhandn.github.io";
  var LOCAL_BASE = {
    "tech-lab": "http://127.0.0.1:4202/",
    "economic-lab": "http://127.0.0.1:4203/",
    "policy-lab": "http://127.0.0.1:4204/",
    "philosophy-lab": "http://127.0.0.1:4201/",
    "letrinhan-site": "http://127.0.0.1:5173/letrinhan-site/",
  };
  var PORT_LAB = {
    "4201": "philosophy-lab",
    "4202": "tech-lab",
    "4203": "economic-lab",
    "4204": "policy-lab",
    "5173": "letrinhan-site",
  };

  function isLocalHost() {
    var h = location.hostname;
    return h === "localhost" || h === "127.0.0.1";
  }

  function resolveSiteHref(href) {
    if (!href || !isLocalHost()) return href;
    try {
      var url = new URL(href, location.href);
      if (url.hostname !== "letrinhandn.github.io") return href;
      var parts = url.pathname.split("/").filter(Boolean);
      var key = parts[0];
      if (!key || !LOCAL_BASE[key]) return href;
      var rest = parts.slice(1).join("/");
      if (!rest) return LOCAL_BASE[key];
      return (
        LOCAL_BASE[key] + rest + (url.pathname.endsWith("/") ? "/" : "")
      );
    } catch (e) {
      return href;
    }
  }

  function currentLabKey() {
    var labKey = PORT_LAB[location.port] || null;
    if (!labKey) {
      var m = location.pathname.match(
        /\/(tech-lab|economic-lab|policy-lab|philosophy-lab|letrinhan-site)(?:\/|$)/
      );
      if (m) labKey = m[1];
    }
    return labKey;
  }

  function rewriteLocalNav() {
    if (!isLocalHost()) return;
    document
      .querySelectorAll('a[href*="letrinhandn.github.io"]')
      .forEach(function (a) {
        var next = resolveSiteHref(a.getAttribute("href"));
        if (next) a.setAttribute("href", next);
      });
  }

  function markActiveLinks() {
    var labKey = currentLabKey();
    if (!labKey) return;
    var localHref = LOCAL_BASE[labKey];
    var prodHref = PROD_ORIGIN + "/" + labKey;
    document
      .querySelectorAll(".navbar-nav .nav-link, .site-drawer-link")
      .forEach(function (a) {
        var href = a.getAttribute("href") || "";
        var on =
          href === localHref ||
          href.indexOf(prodHref) === 0 ||
          (localHref && href.indexOf(localHref) === 0);
        a.classList.toggle("active", on);
        if (on) a.setAttribute("aria-current", "page");
        else a.removeAttribute("aria-current");
      });
  }

  var brand = document.querySelector(".navbar-brand");
  if (brand) {
    brand.setAttribute(
      "href",
      resolveSiteHref("https://letrinhandn.github.io/letrinhan-site/")
    );
  }

  rewriteLocalNav();

  document.querySelectorAll(".quarto-listing-category-title").forEach(function (el) {
    el.textContent = "Tags";
  });

  function readTheme() {
    try {
      var t = localStorage.getItem(THEME_KEY);
      if (t === "light" || t === "dark") return t;
    } catch (e) {}
    return document.documentElement.dataset.theme === "light" ? "light" : "dark";
  }

  function readLang() {
    try {
      var l = localStorage.getItem(LANG_KEY);
      if (l === "vi" || l === "en") return l;
    } catch (e) {}
    return (navigator.language || "vi").toLowerCase().startsWith("vi") ? "vi" : "en";
  }

  function sunSvg() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path stroke-linecap="square" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  }

  function moonSvg() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 7 7 0 1 0 20.5 14.2Z"/></svg>';
  }

  function menuSvg(open) {
    if (open) {
      return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="square" d="M6 6l12 12M18 6L6 18"/></svg>';
    }
    return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="square" d="M4 7h16M4 12h16M4 17h16"/></svg>';
  }

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    try {
      localStorage.setItem(THEME_KEY, theme);
    } catch (e) {}
    var btn = document.getElementById("theme-chip");
    if (btn) {
      btn.innerHTML = theme === "dark" ? moonSvg() : sunSvg();
      btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
    }
  }

  function navLabelFor(href, fallback, lang) {
    var path = (href || "").toLowerCase();
    var vi = lang !== "en";
    if (path.indexOf("philosophy-lab") !== -1) {
      return vi ? "Triết học" : "Philosophy";
    }
    if (path.indexOf("tech-lab") !== -1) return vi ? "Công nghệ" : "Tech";
    if (path.indexOf("economic-lab") !== -1) return vi ? "Kinh tế" : "Economics";
    if (path.indexOf("policy-lab") !== -1) return vi ? "Chính sách" : "Policy";
    var t = (fallback || "").replace(/\s+/g, " ").trim();
    // Never keep abbreviated Phil / Triết in the chrome
    if (/^phil$/i.test(t) || /^tri[eế]t$/i.test(t)) {
      return vi ? "Triết học" : "Philosophy";
    }
    return t;
  }

  function syncNavLabels(lang) {
    document.querySelectorAll(".site-drawer-link, .navbar-nav .nav-link").forEach(function (a) {
      var href = a.getAttribute("href") || "";
      var next = navLabelFor(href, a.textContent, lang);
      if (next) {
        a.textContent = next;
        a.title = next;
      }
    });
  }

  function applyLang(lang) {
    if (lang !== "vi" && lang !== "en") lang = "vi";
    try {
      localStorage.setItem(LANG_KEY, lang);
    } catch (e) {}
    document.documentElement.dataset.lang = lang;
    var btn = document.getElementById("lang-chip");
    // Current language chip (VI / EN) — matches visible copy
    if (btn) btn.textContent = lang === "vi" ? "VI" : "EN";
    var notebooks = document.querySelector(".site-drawer-label");
    if (notebooks) notebooks.textContent = lang === "vi" ? "Sổ tay" : "Notebooks";
    syncNavLabels(lang);
    buildLangToc(lang);
  }

  // Quarto skips TOC when headings live inside .lang-vi / .lang-en — rebuild for active locale
  function buildLangToc(lang) {
    var sidebar = document.getElementById("quarto-margin-sidebar");
    if (!sidebar) return;
    if (!document.querySelector(".lang-vi, .lang-en")) return;

    var root = document.querySelector(lang === "en" ? ".lang-en" : ".lang-vi");
    if (!root) {
      sidebar.innerHTML = "";
      return;
    }

    var heads = root.querySelectorAll("h2, h3");
    if (!heads.length) {
      sidebar.innerHTML = "";
      return;
    }

    var title = lang === "en" ? "On this page" : "Trong trang này";
    var html =
      '<nav id="TOC" role="doc-toc">' +
      '<h2 id="toc-title">' +
      title +
      "</h2><ul class=\"summary\">";

    var pendingClose = false;
    heads.forEach(function (h) {
      var id = h.id;
      if (!id) {
        id = (h.getAttribute("data-anchor-id") || "").trim();
        if (id) h.id = id;
      }
      if (!id) return;
      var text = (h.textContent || "").replace(/\s+/g, " ").trim();
      if (!text) return;
      var level = h.tagName.toLowerCase() === "h3" ? 3 : 2;
      if (level === 2) {
        if (pendingClose) html += "</ul></li>";
        html +=
          '<li><a href="#' +
          id +
          '" class="nav-link">' +
          text +
          "</a><ul>";
        pendingClose = true;
      } else {
        if (!pendingClose) {
          html += "<li><ul>";
          pendingClose = true;
        }
        html +=
          '<li><a href="#' +
          id +
          '" class="nav-link">' +
          text +
          "</a></li>";
      }
    });
    if (pendingClose) html += "</ul></li>";
    html += "</ul></nav>";
    sidebar.innerHTML = html;
  }

  function collectNavItems() {
    var lang = readLang();
    var seen = {};
    var items = [];
    document.querySelectorAll(".navbar-nav .nav-link").forEach(function (a) {
      var href = a.getAttribute("href") || "";
      var raw = (a.textContent || "").replace(/\s+/g, " ").trim();
      if (!href || !raw) return;
      var resolved = resolveSiteHref(href);
      var text = navLabelFor(resolved || href, raw, lang);
      var key = resolved + "|" + text.toLowerCase();
      if (seen[key]) return;
      seen[key] = true;
      items.push({ href: resolved, text: text, title: text });
    });
    return items;
  }

  function ensureControls(host) {
    if (document.getElementById("site-controls")) {
      return document.getElementById("site-controls");
    }
    var wrap = document.createElement("div");
    wrap.className = "site-controls site-controls-header";
    wrap.id = "site-controls";

    var themeBtn = document.createElement("button");
    themeBtn.type = "button";
    themeBtn.className = "header-chip is-icon";
    themeBtn.id = "theme-chip";
    themeBtn.setAttribute("aria-label", "Toggle theme");
    themeBtn.title = "Toggle theme";
    themeBtn.addEventListener("click", function () {
      applyTheme(readTheme() === "dark" ? "light" : "dark");
    });

    var langBtn = document.createElement("button");
    langBtn.type = "button";
    langBtn.className = "header-chip";
    langBtn.id = "lang-chip";
    langBtn.setAttribute("aria-label", "Toggle language");
    langBtn.title = "Toggle language";
    langBtn.addEventListener("click", function () {
      applyLang(readLang() === "vi" ? "en" : "vi");
    });

    wrap.appendChild(themeBtn);
    wrap.appendChild(langBtn);
    host.appendChild(wrap);
    return wrap;
  }

  function mountLeftDrawer() {
    var navbar =
      document.querySelector("#quarto-header .navbar") ||
      document.querySelector(".navbar");
    var host =
      document.querySelector("#quarto-header .navbar-container") ||
      document.querySelector(".navbar .container-fluid") ||
      navbar;
    if (!navbar || !host) return;

    document.body.classList.add("lab-hub-chrome");

    var oldFooter = document.getElementById("quarto-footer");
    if (oldFooter) oldFooter.remove();

    var collapse = document.getElementById("navbarCollapse");
    var items = collectNavItems();
    if (collapse) {
      collapse.classList.remove("show");
      collapse.setAttribute("hidden", "");
      collapse.style.display = "none";
    }

    var toggler =
      document.querySelector(".navbar-toggler") ||
      document.getElementById("lab-menu-btn");
    if (!toggler) {
      toggler = document.createElement("button");
      toggler.type = "button";
      toggler.className = "navbar-toggler lab-menu-btn";
      toggler.id = "lab-menu-btn";
      host.insertBefore(toggler, host.firstChild);
    }
    toggler.classList.add("lab-menu-btn", "header-chip", "is-icon");
    toggler.removeAttribute("data-bs-toggle");
    toggler.removeAttribute("data-bs-target");
    toggler.removeAttribute("aria-controls");
    toggler.setAttribute("type", "button");
    toggler.setAttribute("aria-expanded", "false");
    toggler.setAttribute("aria-controls", "lab-drawer");
    toggler.setAttribute("aria-label", "Open menu");
    toggler.title = "Open menu";
    toggler.innerHTML = menuSvg(false);

    // Keep brand visually centered; move controls to the right edge of the bar
    var brandBox =
      host.querySelector(".navbar-brand-container") ||
      host.querySelector(".navbar-brand");
    var controls = ensureControls(host);

    // Force single-row DOM order: menu | (absolute brand) | theme/lang
    // Prevents Bootstrap order from dropping the toggler onto grid row 2
    if (toggler.parentNode === host) host.insertBefore(toggler, host.firstChild);
    if (brandBox && brandBox.parentNode === host) {
      brandBox.classList.add("lab-header-brand");
      host.insertBefore(brandBox, toggler.nextSibling);
    }
    if (controls && controls.parentNode === host) host.appendChild(controls);
    if (collapse && collapse.parentNode === host) {
      collapse.setAttribute("hidden", "");
      collapse.style.display = "none";
    }
    var tools = host.querySelector(".quarto-navbar-tools");
    if (tools) tools.style.display = "none";

    // Force hub order: menu | brand | controls
    host.classList.add("lab-header-bar");
    if (brandBox) brandBox.classList.add("lab-header-brand");

    if (document.getElementById("lab-drawer-layer")) {
      markActiveLinks();
      return;
    }

    var layer = document.createElement("div");
    layer.className = "site-drawer-layer";
    layer.id = "lab-drawer-layer";
    layer.setAttribute("aria-hidden", "true");

    var backdrop = document.createElement("button");
    backdrop.type = "button";
    backdrop.className = "site-drawer-backdrop";
    backdrop.setAttribute("aria-label", "Close menu");
    backdrop.tabIndex = -1;

    var drawer = document.createElement("nav");
    drawer.className = "site-drawer";
    drawer.id = "lab-drawer";
    drawer.setAttribute("aria-label", "Notebooks");

    var label = document.createElement("p");
    label.className = "site-drawer-label";
    label.textContent = "Notebooks";
    drawer.appendChild(label);

    items.forEach(function (item) {
      var a = document.createElement("a");
      a.className = "site-drawer-link";
      a.href = item.href;
      a.title = item.title;
      a.textContent = item.text;
      a.tabIndex = -1;
      a.addEventListener("click", function () {
        setDrawerOpen(false);
      });
      drawer.appendChild(a);
    });

    layer.appendChild(backdrop);
    layer.appendChild(drawer);
    document.body.appendChild(layer);

    var open = false;
    function setDrawerOpen(next) {
      open = !!next;
      layer.classList.toggle("is-open", open);
      layer.setAttribute("aria-hidden", open ? "false" : "true");
      document.body.classList.toggle("lab-drawer-open", open);
      document.body.style.overflow = open ? "hidden" : "";
      toggler.setAttribute("aria-expanded", open ? "true" : "false");
      toggler.setAttribute("aria-label", open ? "Close menu" : "Open menu");
      toggler.title = open ? "Close menu" : "Open menu";
      toggler.innerHTML = menuSvg(open);
      backdrop.tabIndex = open ? 0 : -1;
      drawer.querySelectorAll(".site-drawer-link").forEach(function (a) {
        a.tabIndex = open ? 0 : -1;
      });
    }

    toggler.addEventListener("click", function (event) {
      event.preventDefault();
      event.stopPropagation();
      setDrawerOpen(!open);
    });
    backdrop.addEventListener("click", function () {
      setDrawerOpen(false);
    });
    window.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && open) setDrawerOpen(false);
    });
    window.addEventListener(
      "scroll",
      function () {
        if (open) setDrawerOpen(false);
      },
      { passive: true }
    );

    markActiveLinks();
  }

  mountLeftDrawer();
  applyTheme(readTheme());
  applyLang(readLang());
  markActiveLinks();
});
</script>
