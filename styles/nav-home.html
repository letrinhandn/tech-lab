<script>
document.addEventListener("DOMContentLoaded", function () {
  var THEME_KEY = "letrinhan-site-theme";
  var LANG_KEY = "letrinhan-site-locale";

  var brand = document.querySelector(".navbar-brand");
  if (brand) brand.setAttribute("href", "https://letrinhandn.github.io/letrinhan-site/");

  document.querySelectorAll(".quarto-listing-category-title").forEach(function (el) {
    el.textContent = "Tags";
  });

  function readTheme() {
    try {
      var t = localStorage.getItem(THEME_KEY);
      if (t === "light" || t === "dark") return t;
    } catch (e) {}
    return document.documentElement.dataset.theme === "light" ? "light" : "dark";
  }

  function readLang() {
    try {
      var l = localStorage.getItem(LANG_KEY);
      if (l === "vi" || l === "en") return l;
    } catch (e) {}
    return (navigator.language || "vi").toLowerCase().startsWith("vi") ? "vi" : "en";
  }

  function sunSvg() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path stroke-linecap="square" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  }

  function moonSvg() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 7 7 0 1 0 20.5 14.2Z"/></svg>';
  }

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    try {
      localStorage.setItem(THEME_KEY, theme);
    } catch (e) {}
    var btn = document.getElementById("theme-chip");
    if (btn) {
      btn.innerHTML = theme === "dark" ? moonSvg() : sunSvg();
      btn.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
    }
  }

  function applyLang(lang) {
    if (lang !== "vi" && lang !== "en") lang = "vi";
    try {
      localStorage.setItem(LANG_KEY, lang);
    } catch (e) {}
    document.documentElement.dataset.lang = lang;
    var btn = document.getElementById("lang-chip");
    if (btn) btn.textContent = lang === "vi" ? "VI" : "EN";
    buildLangToc(lang);
  }

  // Quarto skips TOC when headings live inside .lang-vi / .lang-en — rebuild for active locale
  function buildLangToc(lang) {
    var sidebar = document.getElementById("quarto-margin-sidebar");
    if (!sidebar) return;
    if (!document.querySelector(".lang-vi, .lang-en")) return;

    var root = document.querySelector(lang === "en" ? ".lang-en" : ".lang-vi");
    if (!root) {
      sidebar.innerHTML = "";
      return;
    }

    var heads = root.querySelectorAll("h2, h3");
    if (!heads.length) {
      sidebar.innerHTML = "";
      return;
    }

    var title = lang === "en" ? "On this page" : "Trong trang này";
    var html =
      '<nav id="TOC" role="doc-toc">' +
      '<h2 id="toc-title">' +
      title +
      "</h2><ul class=\"summary\">";

    var pendingClose = false;
    heads.forEach(function (h) {
      var id = h.id;
      if (!id) {
        id = (h.getAttribute("data-anchor-id") || "").trim();
        if (id) h.id = id;
      }
      if (!id) return;
      var text = (h.textContent || "").replace(/\s+/g, " ").trim();
      if (!text) return;
      var level = h.tagName.toLowerCase() === "h3" ? 3 : 2;
      if (level === 2) {
        if (pendingClose) html += "</ul></li>";
        html +=
          '<li><a href="#' +
          id +
          '" class="nav-link">' +
          text +
          '</a><ul>';
        pendingClose = true;
      } else {
        if (!pendingClose) {
          html += "<li><ul>";
          pendingClose = true;
        }
        html +=
          '<li><a href="#' +
          id +
          '" class="nav-link">' +
          text +
          "</a></li>";
      }
    });
    if (pendingClose) html += "</ul></li>";
    html += "</ul></nav>";
    sidebar.innerHTML = html;
  }

  var host = document.querySelector(".navbar");
  if (host && !document.getElementById("site-controls")) {
    var wrap = document.createElement("div");
    wrap.className = "site-controls";
    wrap.id = "site-controls";

    var themeBtn = document.createElement("button");
    themeBtn.type = "button";
    themeBtn.className = "header-chip is-icon";
    themeBtn.id = "theme-chip";
    themeBtn.setAttribute("aria-label", "Toggle theme");
    themeBtn.title = "Toggle theme";
    themeBtn.addEventListener("click", function () {
      applyTheme(readTheme() === "dark" ? "light" : "dark");
    });

    var langBtn = document.createElement("button");
    langBtn.type = "button";
    langBtn.className = "header-chip";
    langBtn.id = "lang-chip";
    langBtn.setAttribute("aria-label", "Toggle language");
    langBtn.title = "Toggle language";
    langBtn.addEventListener("click", function () {
      applyLang(readLang() === "vi" ? "en" : "vi");
    });

    wrap.appendChild(themeBtn);
    wrap.appendChild(langBtn);
    host.appendChild(wrap);
  }

  applyTheme(readTheme());
  applyLang(readLang());
});
</script>
